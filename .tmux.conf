# ~/.tmux.conf — tuned for agentic engineering (nvim + terminal + claude code)

# ── Prefix ────────────────────────────────────────────────
# Remap prefix to Ctrl-a (easier reach; frees Ctrl-b)
unbind C-b
set -g prefix C-a
bind C-a send-prefix          # press C-a twice to send a literal C-a to the shell

# ── General ───────────────────────────────────────────────
set -g mouse on               # click to focus panes, scroll wheel, drag borders to resize
set -g base-index 1           # windows start at 1, not 0
setw -g pane-base-index 1     # panes too
set -g renumber-windows on    # keep window numbers gapless
set -sg escape-time 10        # near-zero delay — critical for nvim (Esc feels instant)
set -g history-limit 50000    # bigger scrollback for long claude/build output
set -g focus-events on        # lets nvim autoread / focus autocmds fire
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"   # truecolor for nvim themes

# ── Splits open in the current pane's directory ───────────
bind | split-window -h -c "#{pane_current_path}"   # C-a |  → left/right
bind - split-window -v -c "#{pane_current_path}"   # C-a -  → top/bottom
unbind '"'
unbind %

# ── Navigate panes with prefix + hjkl (vim-style) ─────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ── Resize panes with prefix + HJKL (repeatable) ──────────
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── vim-tmux-navigator: seamless Ctrl-hjkl across nvim + tmux ─
# If the focused pane runs vim, pass the key through; else switch panes.
# No prefix needed — with Caps=Ctrl these are Caps+h/j/k/l.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R

# ── Quality of life ───────────────────────────────────────
bind r source-file ~/.tmux.conf \; display "Config reloaded"   # C-a r
bind c new-window -c "#{pane_current_path}"

# ── Copy mode uses vim keys ───────────────────────────────
setw -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# ── Status bar: calmer than default ───────────────────────
set -g status-style "bg=default"
set -g status-left "#[bold] #S  "
set -g status-right "%H:%M "
